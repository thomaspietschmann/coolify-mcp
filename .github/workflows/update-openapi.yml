name: Update Coolify OpenAPI spec

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh openapi.json
        run: npm run update:api

      - name: Open PR if the spec changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update bundled Coolify OpenAPI spec"
          title: "Update bundled Coolify OpenAPI spec"
          body: |
            Automated refresh of `openapi.json` from the official Coolify source.
            Only opened when the spec actually changed.
          branch: chore/update-openapi
          delete-branch: true
          add-paths: openapi.json
